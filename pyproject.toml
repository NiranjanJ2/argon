[project]
name = "argon"
version = "2.0.0"
description = "Niranjan's personal assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "openai>=2.8.0",
    "loguru>=0.7.3,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "flask>=3.0.0,<4.0.0",
    "discord.py>=2.5.2,<3.0.0",
    "google-auth>=2.0.0,<3.0.0",
    "google-auth-oauthlib>=1.0.0,<2.0.0",
    "google-api-python-client>=2.0.0,<3.0.0",
    # web_search / web_fetch
    "ddgs>=9.5.5,<10.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
argon = "argon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "argon/**/*.py",
    "argon/prompts/**/*.md",
    "argon/skills/**/*.md",
]

[tool.hatch.build.targets.wheel]
packages = ["argon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
